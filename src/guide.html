<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#241E17">
<title>Welcome — LOAM · Thessaloniki</title>
<meta name="description" content="LOAM guest guide — everything you need for your stay in central Thessaloniki.">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Commissioner:wght@400;500;600;700&display=swap');

:root{
  --paper:#F3EBDA; --card:#FBF6EC; --ink:#241E17;
  --ochre:#9C7A22; --gold:#C9A85E; --tan:#B4915F;
  --line:#E4D8BF; --mut:#8A7F6B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
  font-family:'Commissioner',ui-sans-serif,system-ui,sans-serif;
  -webkit-text-size-adjust:100%;line-height:1.5}
.wrap{max-width:680px;margin:0 auto}
.px{padding-left:18px;padding-right:18px}

/* Masthead */
.mast{background:var(--ink);color:#F3EDE1;padding:18px 18px 0}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kicker{font-size:10.5px;letter-spacing:.16em;color:var(--gold);font-weight:600}
.langs{display:flex;gap:5px}
.langs button{appearance:none;border:1px solid #5A4E3C;background:none;color:#C3B79E;
  font:inherit;font-weight:700;font-size:11.5px;padding:4px 8px;border-radius:999px;cursor:pointer}
.langs button.on{background:var(--gold);border-color:var(--gold);color:#241E17}
.brand{display:flex;align-items:center;gap:12px;margin:14px 0 2px}
.logomark{width:38px;height:44px;background:#F3EBDA;border-radius:8px 8px 6px 6px;
  display:flex;align-items:flex-end;justify-content:center;flex:0 0 auto;padding:5px 5px 0;overflow:hidden}
.logomark svg{width:100%;height:auto;display:block}
.wordmark{font-family:'Playfair Display',Georgia,serif;font-weight:600;
  font-size:30px;letter-spacing:.22em;color:#FBF6EC;padding-left:.22em}
.mast h1{font-family:'Playfair Display',Georgia,serif;font-weight:600;
  font-size:22px;margin:8px 0 3px;color:#FDFBF6}
.sub{font-size:13px;color:#C3B79E;padding-bottom:13px;
  border-bottom:1px solid rgba(243,237,225,.16)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{appearance:none;background:none;border:none;color:#B7AE9B;font:inherit;
  font-weight:600;font-size:13.5px;padding:13px 11px;cursor:pointer;
  border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#FDFBF6;border-bottom-color:var(--gold)}

/* Content */
main{padding-top:18px;padding-bottom:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:15px 16px;margin-bottom:13px;box-shadow:0 1px 2px rgba(36,30,23,.03)}
.ct{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:16.5px;
  color:var(--ochre);margin-bottom:7px;display:flex;align-items:center;gap:9px}
.ic{font-size:17px;line-height:1}
.card p{margin:6px 0;font-size:14px}
.card p b{color:var(--ink)}
.foot{text-align:center;color:var(--mut);font-size:13px;font-style:italic;padding:14px 0 6px}
.footmark{text-align:center;font-family:'Playfair Display',serif;letter-spacing:.2em;
  color:var(--tan);font-size:14px;padding-bottom:22px}
.vwrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;margin:9px 0 4px;background:#000}
.vwrap.portrait{aspect-ratio:9/16;max-width:300px;margin-left:auto;margin-right:auto}
.vwrap video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;background:#000}
.vplay{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;cursor:pointer;
  background:rgba(36,30,23,.22);display:flex;align-items:center;justify-content:center;transition:background .2s}
.vplay:hover{background:rgba(36,30,23,.34)}
.vplay span{width:62px;height:62px;border-radius:50%;background:rgba(251,246,236,.94);
  box-shadow:0 3px 14px rgba(0,0,0,.4);position:relative;display:block}
.vplay span:after{content:"";position:absolute;top:50%;left:50%;transform:translate(-38%,-50%);
  border-left:20px solid var(--ink);border-top:13px solid transparent;border-bottom:13px solid transparent}
.vph{margin:9px 0 4px;border:1.5px dashed var(--tan);background:#F3EBDA;color:var(--mut);border-radius:12px;padding:30px 14px;text-align:center;font-size:13px;font-weight:600}
</style>
</head>

 area:[
  {ic:"🏛️",t:["Αξιοθέατα με τα πόδια","Sights on foot","Sehenswertes zu Fuß","À pied","A piedi"],b:[
   ["Είστε στην καρδιά του ιστορικού κέντρου. Δίπλα σας: ο Άγιος Δημήτριος (5΄), η Ρωμαϊκή Αγορά (5΄), η Ροτόντα (5΄) και η Καμάρα / Αψίδα Γαλερίου (5΄). Λίγο πιο κάτω: Αγία Σοφία (8΄), πλατεία Αριστοτέλους (12΄) και η παραλία με τον Λευκό Πύργο (15΄). Ανηφορίζοντας φτάνετε στην Άνω Πόλη και τα βυζαντινά τείχη.",
    "You're in the heart of the historic centre. Right by you: Agios Dimitrios church (5 min), the Roman Forum (5 min), the Rotonda (5 min) and the Arch of Galerius / Kamara (5 min). A little downhill: Agia Sofia (8 min), Aristotelous Square (12 min) and the waterfront with the White Tower (15 min). Uphill you reach the Upper Town and the Byzantine walls.",
    "Sie sind im Herzen des historischen Zentrums. Ganz in der Nähe: Kirche Agios Dimitrios (5 Min.), das Römische Forum (5 Min.), die Rotonda (5 Min.) und der Galeriusbogen / Kamara (5 Min.). Etwas bergab: Agia Sofia (8 Min.), Aristotelous-Platz (12 Min.) und die Uferpromenade mit dem Weißen Turm (15 Min.). Bergauf erreichen Sie die Oberstadt und die byzantinischen Mauern.",
    "Vous êtes au cœur du centre historique. Tout près : l'église Agios Dimitrios (5 min), le Forum romain (5 min), la Rotonde (5 min) et l'Arc de Galère / Kamara (5 min). Un peu plus bas : Agia Sofia (8 min), la place Aristotelous (12 min) et le front de mer avec la Tour Blanche (15 min). En montant, vous atteignez la Ville Haute et les remparts byzantins.",
    "Siete nel cuore del centro storico. A due passi: la chiesa di Agios Dimitrios (5 min), il Foro Romano (5 min), la Rotonda (5 min) e l'Arco di Galerio / Kamara (5 min). Poco più in basso: Agia Sofia (8 min), piazza Aristotelous (12 min) e il lungomare con la Torre Bianca (15 min). Salendo si raggiungono la Città Alta e le mura bizantine."]]},

/* videos live at the site root so the guide slug can be rotated freely */
var VBASE="../../assets/video/";

var lang=0, tab="arrive";

function render(){
  var lg=document.getElementById("langs");
  lg.innerHTML="";
  LANGS.forEach(function(code,i){
    var b=document.createElement("button");
    b.textContent=code;
    b.className=(i===lang)?"on":"";
    b.onclick=function(){lang=i;render();};
    lg.appendChild(b);
  });

  document.getElementById("h1").textContent =HEAD.h1[lang];
  document.getElementById("sub").textContent=HEAD.sub[lang];

  var nav=document.getElementById("nav");
  nav.innerHTML="";
  TABS.forEach(function(t){
    var b=document.createElement("button");
    b.textContent=t[1][lang];
    b.className=(t[0]===tab)?"on":"";
    b.onclick=function(){tab=t[0];render();window.scrollTo(0,0);};
    nav.appendChild(b);
  });

  var main=document.getElementById("main");
  main.innerHTML="";
  DATA[tab].forEach(function(card){
    var el=document.createElement("div");el.className="card";
    var h='<div class="ct"><span class="ic">'+card.ic+'</span>'+card.t[lang]+'</div>';
    if(card.vid){
      h+='<div class="vwrap'+(card.portrait?" portrait":"")+'">'
        +'<video controls playsinline webkit-playsinline preload="none" '
        +'poster="'+VBASE+card.vid+'.jpg" '
        +'controlslist="nodownload" disablepictureinpicture>'
        +'<source src="'+VBASE+card.vid+'.mp4" type="video/mp4">'
        +'</video><button class="vplay" aria-label="Play"><span></span></button></div>';
    }
    else if(card.hasOwnProperty("vid")){ h+='<div class="vph">▶  '+(lang===0?"Το βίντεο θα προστεθεί σύντομα":"Video coming soon")+'</div>'; }
    if(card.b) card.b.forEach(function(item){ h+='<p>'+item[lang]+'</p>'; });
    el.innerHTML=h;
    main.appendChild(el);
  });

  /* play overlay: tap starts the video in place, then hands over to native controls.
     Only one video plays at a time. */
  main.querySelectorAll(".vplay").forEach(function(btn){
    var v=btn.parentNode.querySelector("video");
    btn.onclick=function(){ v.play(); };
    v.addEventListener("play",function(){
      btn.style.display="none";
      main.querySelectorAll("video").forEach(function(o){ if(o!==v) o.pause(); });
    });
  });

  var f=document.createElement("p");f.className="foot";f.textContent=HEAD.foot[lang];
  main.appendChild(f);
  var fm=document.createElement("div");fm.className="footmark";fm.textContent="L O A M";
  main.appendChild(fm);
}
render();
</script>

</html>
